<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="cinemaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Film Reel Perforations on top and bottom -->
  <g opacity="0.18" fill="#f59e0b">
    <rect x="40" y="32" width="28" height="20" rx="4"/>
    <rect x="88" y="32" width="28" height="20" rx="4"/>
    <rect x="136" y="32" width="28" height="20" rx="4"/>
    <rect x="184" y="32" width="28" height="20" rx="4"/>
    <rect x="232" y="32" width="28" height="20" rx="4"/>
    <rect x="280" y="32" width="28" height="20" rx="4"/>
    <rect x="328" y="32" width="28" height="20" rx="4"/>
    <rect x="376" y="32" width="28" height="20" rx="4"/>
    <rect x="424" y="32" width="28" height="20" rx="4"/>

    <rect x="40" y="460" width="28" height="20" rx="4"/>
    <rect x="88" y="460" width="28" height="20" rx="4"/>
    <rect x="136" y="460" width="28" height="20" rx="4"/>
    <rect x="184" y="460" width="28" height="20" rx="4"/>
    <rect x="232" y="460" width="28" height="20" rx="4"/>
    <rect x="280" y="460" width="28" height="20" rx="4"/>
    <rect x="328" y="460" width="28" height="20" rx="4"/>
    <rect x="376" y="460" width="28" height="20" rx="4"/>
    <rect x="424" y="460" width="28" height="20" rx="4"/>
  </g>

  <!-- Cinema Projector Beam Glow -->
  <polygon points="256,120 100,340 412,340" fill="url(#glowGrad)"/>

  <!-- Main Symbol: Film Reel + Crown / Lens -->
  <circle cx="256" cy="210" r="92" fill="#151c2e" stroke="url(#goldGrad)" stroke-width="8" filter="url(#cinemaGlow)"/>
  <circle cx="256" cy="210" r="76" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="256" cy="210" r="34" fill="url(#goldGrad)"/>
  <circle cx="256" cy="210" r="14" fill="#0b0f19"/>

  <!-- Reel Hole Ornaments -->
  <circle cx="256" cy="150" r="12" fill="#0b0f19" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="256" cy="270" r="12" fill="#0b0f19" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="196" cy="210" r="12" fill="#0b0f19" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="316" cy="210" r="12" fill="#0b0f19" stroke="#f59e0b" stroke-width="2"/>

  <!-- Play Triangle Accent -->
  <polygon points="251,202 265,210 251,218" fill="#fef08a"/>

  <!-- Brand Typography: «سينما غيثان» -->
  <text x="256" y="360" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">سينما غيثان</text>
  <text x="256" y="398" font-family="'Cairo', sans-serif" font-weight="600" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="4">CINEMA GHAITHAN</text>
  
  <!-- Subtle Stars / Cinema Lights -->
  <circle cx="130" cy="355" r="3" fill="#f59e0b" opacity="0.8"/>
  <circle cx="382" cy="355" r="3" fill="#f59e0b" opacity="0.8"/>
</svg>
